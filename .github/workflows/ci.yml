name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  extension:
    name: Extension — typecheck, lint, depcheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extensions/reprise/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: extensions/reprise

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: extensions/reprise

      - name: ESLint
        run: npm run lint
        working-directory: extensions/reprise

      - name: Dependency cruiser (boundary checks)
        run: npm run depcheck
        working-directory: extensions/reprise

      - name: Unit tests
        run: npm test
        working-directory: extensions/reprise

  core:
    name: Core — typecheck, lint, depcheck, test, no-vscode
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: core

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: core

      - name: ESLint
        run: npm run lint
        working-directory: core

      - name: Dependency cruiser (boundary checks)
        run: npm run depcheck
        working-directory: core

      - name: Unit tests
        run: npm test
        working-directory: core

      - name: No vscode references in core/src
        run: |
          if grep -rn vscode core/src; then
            echo "::error::core/src must not reference vscode"
            exit 1
          fi

  runner:
    name: Runner — tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Runner unit tests
        run: node --test test/**/*.test.mjs
        working-directory: runner

  diagrams:
    name: Mermaid diagrams — parse check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Parse all .mmd diagrams
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d)"
          # Chromium's sandbox is unavailable on the hosted Ubuntu runner.
          echo '{"args":["--no-sandbox"]}' > "$output_dir/puppeteer.json"
          find docs/kit/01-architecture/diagrams -name "*.mmd" | while read f; do
            echo "Checking $f..."
            mmdc --input "$f" --output "$output_dir/$(basename "$f" .mmd).svg" --puppeteerConfigFile "$output_dir/puppeteer.json" --quiet
          done
