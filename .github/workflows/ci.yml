name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  extension:
    name: Extension — typecheck, lint, depcheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extensions/reprise/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: extensions/reprise

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: extensions/reprise

      - name: ESLint
        run: npm run lint
        working-directory: extensions/reprise

      - name: Dependency cruiser (boundary checks)
        run: npm run depcheck
        working-directory: extensions/reprise

      - name: Generated assets are up to date
        run: |
          npm run gen:assets
          git diff --exit-code -- src/providers/bob/prompts.ts src/exec/ci/templates.ts
        working-directory: extensions/reprise

      - name: Unit tests
        run: npm test
        working-directory: extensions/reprise

      - name: Web bundle builds
        run: npm run compile
        working-directory: extensions/reprise

  runner:
    name: Runner — tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Runner unit tests
        run: npm test
        working-directory: runner

      - name: Bundle builds and parses
        run: |
          node runner/build.mjs
          node --check runner/dist/reprise-runner.mjs

  dashboard:
    name: Dashboard — tests and sample build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install extension deps (schema drift check uses ajv)
        run: npm ci
        working-directory: extensions/reprise

      - name: Dashboard tests
        run: npm test
        working-directory: dashboard

  diagrams:
    name: Mermaid diagrams — parse check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Parse all .mmd diagrams
        run: |
          find docs/kit/01-architecture/diagrams -name "*.mmd" | while read f; do
            echo "Checking $f..."
            mmdc --input "$f" --output /dev/null --quiet
          done
