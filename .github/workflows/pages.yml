name: Deploy to GitHub Pages

# Site layout:
#   /      → dashboard/
#   /ide/  → Reprise IDE (Code - OSS web build at ide/CODE_OSS_TAG, built by ide/build.mjs)
#
# Pull requests build the IDE (without deploying) so a broken IDE build is caught before merge.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "ide/**"
      - "extensions/reprise/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ide:
    name: Build Reprise IDE (Code - OSS web)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Code - OSS tag
        id: tag
        run: echo "tag=$(cat ide/CODE_OSS_TAG)" >> "$GITHUB_OUTPUT"

      # The Code - OSS build takes a while; reuse it until the tag, the IDE files or the extension change.
      - name: Restore IDE build
        id: cache
        uses: actions/cache@v4
        with:
          path: ide.tar.gz
          key: ide-${{ steps.tag.outputs.tag }}-${{ hashFiles('ide/**', 'extensions/reprise/src/**', 'extensions/reprise/media/**', 'extensions/reprise/package.json', 'extensions/reprise/package-lock.json', 'extensions/reprise/tsconfig.json', 'extensions/reprise/webpack.config.js') }}

      - name: Check out Code - OSS ${{ steps.tag.outputs.tag }}
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ steps.tag.outputs.tag }}
          path: vscode
          fetch-depth: 1

      - name: Set up Node.js (Code - OSS .nvmrc)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc

      # Native modules in the Code - OSS dev dependencies (same list as microsoft/vscode's pr-node-modules.yml)
      - name: Install build prerequisites
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Build Reprise IDE
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # npm ci downloads prebuilt binaries (e.g. @vscode/ripgrep) through the GitHub API;
          # unauthenticated requests from hosted runners hit the rate limit (403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ide/build.mjs --vscode vscode --out _ide
          tar -czf ide.tar.gz -C _ide .

      - name: Upload IDE build
        uses: actions/upload-artifact@v4
        with:
          name: reprise-ide
          path: ide.tar.gz
          retention-days: 7

  deploy:
    name: Deploy dashboard and IDE to Pages
    needs: ide
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download IDE build
        uses: actions/download-artifact@v4
        with:
          name: reprise-ide

      - name: Assemble site
        run: |
          mkdir -p _site/ide
          cp -r dashboard/. _site/
          tar -xzf ide.tar.gz -C _site/ide
          du -sh _site _site/ide

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
